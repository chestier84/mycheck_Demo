# =============================================================================
#  Datafix Oracle Automático — stack completo en Docker
#
#  Uso:
#      docker compose up -d
#
#  Servicios expuestos al host:
#      🌐 http://localhost:8080         → Sistema web (HTML + API en un origen)
#      📚 http://localhost:8080/docs    → Swagger del backend (proxied)
#      🔌 http://localhost:8000         → Backend FastAPI (acceso directo)
#      🗄️ localhost:1521/XEPDB1         → Oracle XE
#      🌐 https://localhost:5500/em     → Oracle EM Express (SYS / OraclePwd1)
# =============================================================================
services:

  # ---------- Oracle XE 21c ----------
  oracle-xe:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle-xe
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: OraclePwd1
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD", "sqlplus", "-S", "sys/OraclePwd1@//localhost:1521/XEPDB1", "as", "sysdba", "<", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20

  # ---------- Backend FastAPI ----------
  backend:
    build: .
    container_name: datafix-backend
    ports:
      - "8000:8000"
    depends_on:
      oracle-xe:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: 1
      ORACLE_HOST_OVERRIDE: oracle-xe   # 'localhost' del usuario → 'oracle-xe' (DNS interno)
    # Volumen: el main.py local se monta dentro del contenedor para que
    # --reload de uvicorn tome los cambios sin tener que reconstruir la imagen.
    volumes:
      - ./main.py:/app/main.py:ro
    # NOTA: --reload se quitó porque en Windows con Docker Desktop los bind-mounts
    # tienen timestamps poco confiables y uvicorn no detecta los cambios.
    # Para aplicar cambios en main.py: docker compose restart backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ---------- Frontend (HTML) + reverse proxy ----------
  frontend:
    image: nginx:alpine
    container_name: datafix-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ../datafix_oracle.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default