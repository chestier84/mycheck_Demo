# =============================================================================
#  Nginx para Datafix Oracle Automático
#  - Sirve el HTML estático en /
#  - Proxy reverso de /api/* hacia el backend FastAPI
#
#  De esta forma, el navegador habla con un único origen (http://localhost:8080)
#  y desaparecen los problemas de CORS.
# =============================================================================
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ----- Frontend (HTML estático) ---------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ----- API REST → backend FastAPI -------------------------------------
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ----- Swagger del backend (opcional) ---------------------------------
    location /docs {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/docs;
    }
    location /openapi.json {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/openapi.json;
    }
}
